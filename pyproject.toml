[project]
name = "arya-ai-trader"
version = "0.1.0-milestone1"
description = "ARYA AI Trader - Enterprise-grade multi-market technical/fundamental/AI analysis platform"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "pytse-client==0.19.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
arya = "arya.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
