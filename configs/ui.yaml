theme:
  mode: "dark"          # dark | light
  accent_color: "#32C6B0" # teal: primary interactive accent
  secondary_color: "#6C9EFF"
  positive_color: "#43D19E"
  negative_color: "#FF7185"
  surface_color: "#121E31"
  background_color: "#0B1220"
  font_family: "Vazirmatn"
  font_size: 11
  rtl: true

layout:
  default_view: "dashboard"   # dashboard | watchlist | portfolio
  chart_engine: "pyqtgraph"   # pyqtgraph | lightweight-charts (future)

windows:
  main:
    width: 1400
    height: 900
    remember_geometry: true

localization:
  default_language: "fa"
  available: ["fa", "en"]
