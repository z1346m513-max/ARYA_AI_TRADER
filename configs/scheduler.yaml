# زمان‌بندی به‌روزرسانی خودکار.

global_default: "5m"

markets:
  stock:
    interval: "1m"
    market_hours_only: true
    open_time: "09:00"
    close_time: "12:30"

  crypto:
    interval: "30s"
    market_hours_only: false

  forex:
    interval: "5m"
    market_hours_only: false

background_jobs:
  news_refresh: "15m"
  codal_refresh: "1h"
  fundamental_refresh: "1h"
  portfolio_revaluation: "1m"
  daily_ingest: "off"   # پیشنهاد cron: 30 16 * * 0-4 (Asia/Tehran)
