# زمان‌بندی به‌روزرسانی خودکار. هر بازار می‌تواند زمان‌بندی مجزا داشته باشد.
# مقادیر مجاز: 30s, 1m, 5m, 15m, 30m, 1h یا cron-style در آینده.

global_default: "5m"

markets:
  stock:
    interval: "1m"
    market_hours_only: true
    open_time: "09:00"
    close_time: "12:30"

  crypto:
    interval: "30s"
    market_hours_only: false

  forex:
    interval: "5m"
    market_hours_only: false

history_cache:
  # Daily TSETMC history changes during the session, so refresh quickly while
  # the market is open. Outside the session, retain yesterday/latest data
  # longer and tolerate provider outages.
  stock:
    fresh_ttl_seconds: 60
    stale_grace_seconds: 900
    outside_session_ttl_seconds: 21600
    outside_session_stale_grace_seconds: 172800

background_jobs:
  news_refresh: "15m"
  codal_refresh: "1h"
  fundamental_refresh: "1h"
  portfolio_revaluation: "1m"
