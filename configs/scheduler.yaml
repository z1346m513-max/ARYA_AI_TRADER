# زمان‌بندی مخصوص جلسه معاملاتی بورس ایران (Asia/Tehran)

enabled: true

global_default: "5m"

markets:
  stock:
    interval: "1m"
    market_hours_only: true
    open_time: "09:00"
    close_time: "12:30"

jobs:
  pre_market_symbols:
    cron: "30 8 * * 6,0,1,2,3"
    market: stock
    task: refresh_symbol_master

  intraday_prices:
    cron: "*/5 9-12 * * 6,0,1,2,3"
    market: stock
    task: refresh_ohlcv_watchlist

  post_market_scan:
    cron: "45 12 * * 6,0,1,2,3"
    market: stock
    task: daily_scan

background_jobs:
  news_refresh: "15m"
  codal_refresh: "1h"
  fundamental_refresh: "1h"
  portfolio_revaluation: "1m"

# اعداد cron نمونه هستند؛ با تقویم تعطیلات رسمی TSE هم‌تراز شوند.
