# فقط بازار سرمایه ایران
# mock برای تست آفلاین؛ tsetmc برای داده روزانه بورس

market:
  stock:
    driver: "tsetmc"      # mock | tsetmc
    enabled: true
    display_name: "بورس ایران"
    currency: "IRR"
    rate_limit_per_min: 60
    timeout_seconds: 15
    retries: 3
    base_url: "https://cdn.tsetmc.com"
    session:
      timezone: "Asia/Tehran"
      open: "09:00"
      close: "12:30"

codal:
  driver: "mock"
  enabled: false

news:
  driver: "mock"
  enabled: false

macro:
  driver: "mock"
  enabled: false

sentiment:
  driver: "mock"
  enabled: false
