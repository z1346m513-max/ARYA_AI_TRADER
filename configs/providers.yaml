# تعریف Providerهای داده. فاز اول با TSETMC برای بورس ایران اجرا می‌شود.
# mock همچنان برای تست آفلاین و توسعه بدون شبکه در دسترس است.

market:
  stock:
    driver: "tsetmc"      # mock | tsetmc | ...
    enabled: true
    rate_limit_per_min: 60
    timeout_seconds: 15
    retries: 3
    base_url: "https://cdn.tsetmc.com"

  crypto:
    driver: "mock"        # mock | binance | ...
    enabled: true
    rate_limit_per_min: 1200

  forex:
    driver: "mock"        # mock | oanda | ...
    enabled: false
    rate_limit_per_min: 60

codal:
  driver: "mock"
  enabled: false

# مالکیت بخش: Z.ai (جدول مالکیت فایل — CR-20261024-002)
# درایور واقعی snapshot بازارکامل حقیقی/حقوقی؛ هیچ دادهٔ mock/synthetic تولید نمی‌کند.
# data_quality: usable فقط پس از انتساب موفق تاریخ snapshot به یک روز بستهٔ واقعی.
shareholders:
  driver: "tsetmc_client_type"
  enabled: true
  snapshot_volume_tolerance: 0.05   # حداکثر اختلاف نسبی مجاز حجم snapshot با روز بسته
  closing_history_days: 30          # پنجرهٔ تاریخچهٔ بسته برای انتساب تاریخ
  timeout_seconds: 15
  retries: 3
  base_url_cdn: "https://cdn.tsetmc.com"
  base_url_old: "https://old.tsetmc.com"

news:
  driver: "mock"
  enabled: false

macro:
  driver: "mock"
  enabled: false

sentiment:
  driver: "mock"
  enabled: false
