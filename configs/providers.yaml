# تعریف Providerهای داده.
# mock برای توسعه/تست آفلاین و tsetmc برای داده واقعی بورس ایران فعال هستند.
# در صورت انتخاب tsetmc، اتصال شبکه به TSETMC لازم است.

market:
  stock:
    driver: "tsetmc"      # mock | tsetmc
    enabled: true
    rate_limit_per_min: 60
    adjust: false

  crypto:
    driver: "mock"        # mock | binance | ...
    enabled: true
    rate_limit_per_min: 1200

  forex:
    driver: "mock"        # mock | oanda | ...
    enabled: false
    rate_limit_per_min: 60

codal:
  driver: "mock"
  enabled: false

news:
  driver: "mock"
  enabled: false

macro:
  driver: "mock"
  enabled: false

sentiment:
  driver: "mock"
  enabled: false
