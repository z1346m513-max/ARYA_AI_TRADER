# فقط بورس ایران + کدال

market:
  stock:
    driver: "tsetmc"      # mock | tsetmc
    enabled: true
    display_name: "بورس ایران"
    currency: "IRR"
    rate_limit_per_min: 60
    timeout_seconds: 15
    retries: 3
    base_url: "https://cdn.tsetmc.com"

codal:
  driver: "codal"
  enabled: true
  base_url: "https://search.codal.ir/api/search"
  timeout_seconds: 20
  retries: 3
  backoff_seconds: 1.0
  min_interval_seconds: 1.0

news:
  driver: "mock"
  enabled: false

macro:
  driver: "mock"
  enabled: false

sentiment:
  driver: "mock"
  enabled: false
